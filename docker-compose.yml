services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - sonar-network

  sonarqube_postgres:
    image: postgres:15
    container_name: sonarqube_postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sonar-network
    expose:
      - "5432"

  salesorder_postgres:
    image: postgres:15
    container_name: salesorder_postgres
    environment:
      POSTGRES_DB: salesorder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - salesorder_pg_data:/var/lib/postgresql/data
    networks:
      - sonar-network

  distributor-mock:
    image: halverneus/static-file-server
    container_name: distributor_mock
    ports:
      - "8082:8080"
    volumes:
      - ./distributor-mock:/web
    networks:
      - sonar-network
      
  salesorder-api:
    build:
      context: .
      dockerfile: salesorder-api-rest/Dockerfile
    container_name: salesorder-api-rest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://salesorder_postgres:5432/salesorder
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - DISTRIBUTOR_API_URL=http://distributor-mock:8080/api
    depends_on:
      - salesorder_postgres
      - distributor-mock
    networks:
      - sonar-network
      
  resale-api:
    build:
      context: .
      dockerfile: resale-api-rest/Dockerfile
    container_name: resale-api-rest
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://salesorder_postgres:5432/salesorder
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - salesorder_postgres
    networks:
      - sonar-network


volumes:
  sonarqube_data:
  sonarqube_extensions:
  pg_data:
  salesorder_pg_data:

networks:
  sonar-network:
    driver: bridge
