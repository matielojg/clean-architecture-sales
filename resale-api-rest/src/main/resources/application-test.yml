spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    access:
      default: none
  datadog:
    metrics:
      export:
        enabled: false
  metrics:
    enable:
      all: false

logging:
  level:
    root: WARN
